name: 🤖 Actualizar Leads Automáticamente

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8:00 AM UTC
  workflow_dispatch: # Botón para ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar librerías
        run: pip install -r requirements.txt

      - name: 🕷️ Ejecutar Scraper
        run: python scraper.py

      - name: 💾 Guardar cambios en GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Actualización diaria de leads (MIPYMES y Personas)"
          file_pattern: "data/leads.csv"
