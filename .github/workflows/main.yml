name: Create leads.csv

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'   # corre todos los días a las 12:00 UTC (borralo si no lo querés)

jobs:
  generar-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # necesario para que el bot pueda hacer push al repo
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Subir leads.csv como artifact
        uses: actions/upload-artifact@v4
        with:
          name: leads-csv
          path: data/leads.csv

      - name: Commit del leads.csv actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.csv
          git diff --cached --quiet || git commit -m "Actualizar leads.csv [skip ci]"
          git push
